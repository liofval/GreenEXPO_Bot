name: Daily GreenExpo News

on:
  schedule:
    # 09:00 JST = 00:00 UTC（GitHub Actionsのcronは数分〜十数分遅延することあり）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greenexpo-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r greenexpo/requirements.txt

      - name: Run daily notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python greenexpo/main.py --mode daily

      - name: Commit state.json
        run: |
          if [[ -z "$(git status --porcelain greenexpo/state.json)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenexpo/state.json
          git commit -m "chore: update state.json (daily)"
          git pull --rebase origin main
          git push
