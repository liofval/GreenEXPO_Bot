name: Student Bosyu Poll

on:
  schedule:
    # 毎時15分（greenexpo-official の :05 と時間をずらす）
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: student-bosyu
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r student-bosyu/requirements.txt

      - name: Poll PR TIMES
        env:
          SLACK_WEBHOOK_URL_BOSYU: ${{ secrets.SLACK_WEBHOOK_URL_BOSYU }}
        run: python student-bosyu/main.py

      - name: Commit state.json
        run: |
          if [[ -z "$(git status --porcelain student-bosyu/state.json)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-bosyu/state.json
          git commit -m "chore: update state.json (student-bosyu)"
          git pull --rebase origin main
          git push
